<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VividAI Studio - Creator Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0b10] text-gray-100 flex h-screen overflow-hidden font-sans">

    <aside class="w-72 bg-[#12141c] border-r border-gray-800 flex flex-col justify-between hidden md:flex">
        <div>
            <div class="p-6 border-b border-gray-800 flex items-center space-x-3">
                <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold p-2.5 rounded-xl text-lg">VA</div>
                <div>
                    <h1 class="font-bold text-sm tracking-wider text-white">VIVID AI</h1>
                    <span class="text-[10px] text-gray-400 tracking-widest uppercase">Creator Suite</span>
                </div>
            </div>
            <nav class="p-4 space-y-1.5 text-sm">
                <div class="text-[11px] font-bold text-gray-500 px-3 pt-2 pb-1 uppercase">Real Konten</div>
                <a href="#" class="flex items-center px-3.5 py-2.5 rounded-xl bg-cyan-500/10 text-cyan-400 font-medium">🖼️ Image Editor</a>
            </nav>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-[#0a0b10]">
        <header class="h-16 border-b border-gray-800 flex items-center justify-between px-8 bg-[#12141c]/40 backdrop-blur">
            <h2 class="text-base font-bold text-gray-200">Image Editor & Generator</h2>
            <span class="text-[11px] bg-purple-500/10 text-purple-400 border border-purple-500/20 px-3 py-1 rounded-full font-medium">POWERED BY GEMINI & IMAGEN</span>
        </header>

        <div class="p-8 flex-1 overflow-y-auto">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 h-full pb-10">
                <div class="bg-[#12141c] border border-gray-800 p-6 rounded-2xl flex flex-col justify-between shadow-xl">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Foto Referensi (Opsional)</label>
                            <div onclick="document.getElementById('file-in').click()" class="border-2 border-dashed border-gray-700 hover:border-cyan-500 rounded-xl h-28 flex flex-col items-center justify-center text-center p-2 cursor-pointer bg-[#0a0b10]/50" id="preview-box">
                                <span class="text-xs text-gray-400 font-medium" id="preview-text">Slot 1 (Klik untuk Upload)</span>
                            </div>
                            <input type="file" id="file-in" class="hidden" accept="image/*" onchange="previewFile(event)">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Instruksi Edit / Pembuatan Gambar Baru</label>
                            <textarea id="prompt-input" rows="3" class="w-full bg-[#0a0b10] border border-gray-700 rounded-xl p-3.5 text-sm text-white focus:outline-none focus:border-cyan-500" placeholder="Deskripsikan gambar..."></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Gaya Pencahayaan (Lighting Style)</label>
                            <select id="style-input" class="w-full bg-[#0a0b10] border border-gray-700 rounded-xl p-3.5 text-sm text-white focus:outline-none focus:border-cyan-500">
                                <option>Flat RAW Light</option>
                                <option>Cinematic Golden Hour</option>
                                <option>Moody Studio Lighting</option>
                            </select>
                        </div>
                    </div>
                    <button onclick="generateAI()" class="mt-6 w-full bg-gradient-to-r from-gray-900 to-indigo-950 border border-gray-700 hover:opacity-90 text-white font-semibold py-3.5 rounded-xl transition text-sm shadow-lg">Hasilkan 4 Varian Master Prompt</button>
                </div>

                <div class="bg-[#12141c] border border-gray-800 p-6 rounded-2xl flex flex-col items-center justify-center text-center shadow-xl overflow-y-auto">
                    <div id="output-result" class="text-gray-500 text-sm">Hasil Master Prompt AI profesional akan muncul di sini.</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function previewFile(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const box = document.getElementById('preview-box');
                    box.style.backgroundImage = `url(${e.target.result})`;
                    box.style.backgroundSize = 'cover';
                    box.style.backgroundPosition = 'center';
                    document.getElementById('preview-text').innerHTML = `<span class="bg-black/70 text-white text-[10px] px-2 py-0.5 rounded">Terupload ✓</span>`;
                };
                reader.readAsDataURL(file);
            }
        }

        async function generateAI() {
            const prompt = document.getElementById('prompt-input').value;
            const style = document.getElementById('style-input').value;
            const output = document.getElementById('output-result');

            if (!prompt) return alert('Mohon isi instruksi terlebih dahulu!');

            output.innerHTML = `<div class="animate-pulse text-cyan-400 text-sm">Sedang meracik master prompt profesional...</div>`;

            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, style })
                });

                const data = await res.json();
                if (data.result) {
                    output.innerHTML = `<div class="text-left space-y-2 max-h-[450px] overflow-y-auto w-full"><p class="text-emerald-400 font-bold text-xs uppercase">✨ Master Prompt Hasil AI:</p><pre class="text-gray-200 text-xs bg-[#0a0b10] p-4 rounded-xl border border-gray-800 whitespace-pre-wrap font-sans leading-relaxed">${data.result}</pre></div>`;
                } else {
                    output.innerHTML = `<span class="text-red-400 text-xs">Gagal: ${data.error}</span>`;
                }
            } catch (err) {
                output.innerHTML = `<span class="text-red-400 text-xs">Gagal terhubung ke server.</span>`;
            }
        }
    </script>
</body>
</html>
